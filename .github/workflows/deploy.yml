name: Déploiement sur o2switch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run build

      # lftp gère le FTPS explicite d'o2switch (l'action FTP-Deploy échouait avec ECONNRESET).
      - name: Installer lftp
        working-directory: .
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoi par FTPS
        working-directory: .
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:max-retries 3
          set net:timeout 20
          mirror --reverse --delete --verbose --parallel=2 \
            --exclude-glob .well-known/ --exclude-glob cgi-bin/ --exclude-glob .ftpquota \
            site/dist/ "${FTP_DIR:-./}"
          bye
          EOF
