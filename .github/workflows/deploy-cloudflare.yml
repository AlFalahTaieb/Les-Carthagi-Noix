name: Déploiement sur Cloudflare

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *' # chaque jour (UTC) : met à jour le compteur d'adhérents
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Compter les adhérents
        run: npm run adherents
        env:
          HELLOASSO_CLIENT_ID: ${{ secrets.HELLOASSO_CLIENT_ID }}
          HELLOASSO_CLIENT_SECRET: ${{ secrets.HELLOASSO_CLIENT_SECRET }}
          HELLOASSO_URL: ${{ vars.HELLOASSO_URL }}
          HELLOASSO_FROM: ${{ vars.HELLOASSO_FROM }}
      - run: npm run build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
      - name: Publier sur Cloudflare
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  invitation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Préparer la page (injection de la clé Web3Forms)
        working-directory: invitation
        env:
          CLE: ${{ secrets.WEB3FORMS_KEY }}
        run: |
          mkdir dist
          cp *.html *.jpg dist/
          sed -i "s/__WEB3FORMS_KEY__/$CLE/" dist/index.html
      - name: Publier sur Cloudflare
        working-directory: invitation
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
